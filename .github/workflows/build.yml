name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build SpeedOverlay
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: brew install ldid xz

      - name: Setup Theos
        run: git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

      - name: Setup iOS SDKs
        run: |
          rm -rf ${{ github.workspace }}/theos/sdks
          git clone https://github.com/theos/sdks.git ${{ github.workspace }}/theos/sdks

      - name: Setup Headers
        run: |
          mkdir -p ${{ github.workspace }}/theos/include
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git ${{ github.workspace }}/theos/include/YouTubeHeader

      - name: Build Package
        run: |
          make clean
          make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: rootless

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          cp packages/*.deb output/
          cp SpeedOverlay.plist output/
          if [ -f .theos/obj/SpeedOverlay.dylib ]; then
            cp .theos/obj/SpeedOverlay.dylib output/
          elif [ -f .theos/obj/debug/SpeedOverlay.dylib ]; then
            cp .theos/obj/debug/SpeedOverlay.dylib output/
          fi

      - name: Generate Release Tag
        id: tag
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SpeedOverlay ${{ steps.tag.outputs.version }}
          files: output/*
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
